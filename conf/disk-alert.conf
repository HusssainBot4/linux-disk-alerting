# Default thresholds
DEFAULT_WARN=80
DEFAULT_CRIT=90

# Inode thresholds
INODE_WARN=80
INODE_CRIT=90

# Per-mount overrides
# Format:
# mountpoint:warning:critical
MOUNT_THRESHOLDS="
/:75:85
/var:70:85
/var/log:75:90
/home:85:93
/backup:90:96
"

# Don't alert repeatedly for the same
# mount/severity within this period.
COOLDOWN_SECONDS=3600

# Alert channels
ALERT_CHANNELS="log email"

# Email recipient
ALERT_EMAIL="ops@example.com"

# Slack webhook
SLACK_WEBHOOK=""

# Evidence limits
TOP_DIRS=5
TOP_FILES=5

# Runtime state
STATE_DIR="/opt/devopsshack/state/disk"
